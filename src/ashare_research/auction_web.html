<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>竞价监视器 V2</title>
<style>
:root{color-scheme:light;--bg:#f4f6f8;--paper:#fff;--line:#dfe5ec;--ink:#0f172a;--muted:#526174;--accent:#126457;--green:#eaf7ef;--purple:#6743a5}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft YaHei UI","Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}button,input,select{min-height:34px;border:1px solid var(--line);border-radius:6px;background:white;padding:5px 10px}button{cursor:pointer}button:disabled{cursor:default;opacity:.48}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary,[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}
h1,h2,p{margin:0}h1{font-size:17px}h2{font-size:15px}small,.muted{color:var(--muted)}label{display:grid;gap:4px}
#boot,#authGate{min-height:100dvh;display:grid;place-items:center;padding:16px}
.login{width:min(100%,360px);padding:26px;display:grid;gap:16px}.login form,.invite{display:grid;gap:12px}.card,.login{border:1px solid var(--line);border-radius:9px;background:var(--paper)}
header{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line)}
.bar,main{max-width:1500px;margin:auto;padding:0 20px}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding-top:9px;padding-bottom:9px}.brand{margin-right:10px}.identity{margin-left:auto;color:var(--muted)}.segments{display:flex;flex-wrap:wrap;gap:4px}
main{padding-top:12px;padding-bottom:24px;display:grid;gap:10px;min-width:0}.kpi,.toolbar,.pagination,.dialogHead{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:9px 12px}.kpi{color:var(--muted)}.kpi strong{color:var(--ink);margin-left:5px}.toolbar{justify-content:space-between}.search{min-width:0;width:min(100%,220px)}.status{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.warning{color:#854b10}.error{color:#a52532}.pagination{justify-content:flex-end}
.scroll{overflow-x:auto;min-width:0;max-width:100%}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line)}th{background:#f8fafc;color:var(--muted);font-weight:600}th button{min-height:0;padding:0;border:0;background:transparent;color:inherit;font-weight:inherit}th:nth-child(2),th:nth-child(3),td:nth-child(2),td:nth-child(3){text-align:left}tr.qualified{background:var(--green)}tr.qualified td:first-child{box-shadow:inset 3px 0 #21834d}.risk{background:#fdebed;color:#a51f31}.low{background:#fff1dc;color:#93480c}.empty{padding:20px;text-align:center;color:var(--muted)}.mobileMeta{display:none}
.prior{border-top:3px solid var(--purple)}.prior h2{padding:9px 12px;color:var(--purple)}details{padding:8px 12px}summary{cursor:pointer}
dialog{border:1px solid var(--line);border-radius:10px;width:min(560px,calc(100% - 24px));max-height:88dvh;color:var(--ink);padding:0;overflow:auto}dialog::backdrop{background:#0f172a66}.dialogHead{justify-content:space-between;border-bottom:1px solid var(--line)}.dialogBody{padding:14px;display:grid;gap:12px}.account,.credential{padding:10px;border:1px solid var(--line);border-radius:7px}.account .segments{margin-top:6px}.credential{background:#fff5db;overflow-wrap:anywhere}.check{display:flex;align-items:center;gap:7px}.check input{min-height:auto}.qualityRows{margin:0;padding-left:22px;overflow-wrap:anywhere}
@media(max-width:700px){.bar,main{padding-left:10px;padding-right:10px}.bar{gap:5px}.brand{flex:1 0 55%;margin:0}.identity{margin-left:0}.kpi,.toolbar{gap:6px 10px}.search{width:100%}.scroll{overflow-x:visible}table{white-space:normal;table-layout:fixed}th,td{padding:5px 3px;font-size:11px;overflow-wrap:anywhere}th:nth-child(1){width:8%}th:nth-child(2){width:14%}th:nth-child(3){width:18%}th:nth-child(8),td:nth-child(8){display:none}.mobileMeta{display:block;color:var(--muted);font-size:10px}}
dialog[open]{position:fixed;inset:0;margin:auto}
@media(max-width:700px){th.extra,td.extra{display:none}.mobileMeta small{display:block}}
</style>
</head>
<body>
<div id="boot" role="status">正在检查登录状态…</div>
<section id="authGate" hidden>
 <div class="login"><h1>竞价监视器 V2</h1><p class="muted">请使用受邀账号登录</p>
 <form id="loginForm">
  <label>手机号<input id="phone" type="tel" autocomplete="username" required></label>
  <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
  <button id="loginButton" class="primary">登录</button>
 </form><p id="loginState" class="status" role="status"></p></div>
</section>
<div id="appShell" hidden>
 <header><div class="bar">
  <h1 class="brand">竞价监视器 V2</h1>
  <select id="server" aria-label="服务器" hidden></select>
  <select id="date" aria-label="交易日"></select>
  <div class="segments" aria-label="竞价阶段">
   <button data-stage="0915">09:15 门帧</button><button data-stage="0920">09:20 门帧</button><button data-stage="final">09:25 冻结</button>
  </div>
  <button id="refresh">刷新</button><span id="health" class="muted" role="status"></span>
  <span id="identity" class="identity"></span><button id="manageButton" hidden>账号管理</button><button id="logoutButton">退出登录</button>
 </div></header>
 <main>
  <div class="kpi card"><span>快照<strong id="observed">—</strong></span><span>当前榜单<strong id="total">—</strong></span><span>市场仓位参考<strong id="exposure">—</strong></span></div>
  <p id="notice" class="status" role="status"></p>
  <div id="quality" class="kpi card warning" hidden><span id="qualitySummary"></span><button id="qualityButton" hidden>查看缺失明细</button></div>
  <section class="card" aria-label="竞价榜单">
   <div class="toolbar"><div class="segments" aria-label="榜单">
    <button data-view="top" aria-pressed="true">竞价指数前30</button><button data-view="qualified" aria-pressed="false">基础与历史门通过</button><button data-view="all" aria-pressed="false">排名明细</button>
   </div><input id="search" class="search" aria-label="筛选当前页" placeholder="筛选当前页代码或名称"></div>
   <div id="table" class="scroll"></div>
   <div class="pagination"><span id="pageInfo" class="muted"></span><button id="previous" disabled>上一页</button><button id="next" disabled>下一页</button></div>
  </section>
  <section class="card prior"><h2 id="historyTitle">昨日 D-1 · 合格个股</h2><div id="history" class="scroll"></div></section>
  <details class="card"><summary>竞价指数 0.5 参考提示</summary><p class="muted">合格股指数低于 0.5 时标橙色。提示供查看，不改变已保存资格。</p></details>
 </main>
</div>
<dialog id="qualityDialog"><div class="dialogHead"><h2>数据不足明细</h2><form method="dialog"><button>关闭</button></form></div><div class="dialogBody"><ul id="qualityRows" class="qualityRows"></ul></div></dialog>
<dialog id="accountsDialog">
 <div class="dialogHead"><h2>账号管理</h2><form method="dialog"><button>关闭</button></form></div>
 <div class="dialogBody">
  <form id="createForm" class="invite">
   <label>手机号<input id="invitePhone" type="tel" pattern="1[3-9][0-9]{9}" required></label>
   <label>8 位英文和数字密码<input id="invitePassword" type="password" minlength="8" maxlength="8" autocomplete="new-password" placeholder="留空自动生成"></label>
   <label class="check"><input id="makeAdmin" type="checkbox">设为管理员</label>
   <button class="primary">创建受邀账号</button>
  </form>
  <div id="credential" class="credential" hidden><p id="credentialText"></p><button id="copy">复制账号和密码</button></div>
  <p id="accountStatus" class="status" role="status"></p><div id="accounts"></div>
 </div>
</dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const stages=[...document.querySelectorAll('[data-stage]')], views=[...document.querySelectorAll('[data-view]')];
const stageOrder=['final','0920','0915'], pageSize=100, viewCache=new Map();
const labels={final:'09:25 冻结',corrected:'09:25 修正'};
const columns=[['rank','名次'],['code','代码'],['name','名称'],['score','竞价指数'],['gap_pct','竞价涨幅'],['matched_amount_yuan','匹配额'],['turnover_pct','竞价换手'],['qualified','资格'],['matched_price','撮合价'],['unmatched_buy_amount_yuan','未匹配买'],['unmatched_sell_amount_yuan','未匹配卖']];
const extraFields=new Set(columns.slice(8).map(([key])=>key));
const sortable=new Set(['score','gap_pct','matched_amount_yuan','turnover_pct']);
const qualityFields={score:'竞价指数',gap_pct:'竞价涨幅',matched_price:'撮合价',matched_volume_lots:'撮合量',matched_amount_yuan:'撮合金额',turnover_pct:'换手率',unmatched_buy_amount_yuan:'未匹配买额',unmatched_sell_amount_yuan:'未匹配卖额',unmatched_buy_turnover_pct:'未匹配买换手率',unmatched_sell_turnover_pct:'未匹配卖换手率'};
const errors={FORBIDDEN:'没有操作权限。',RATE_LIMITED:'请求过多，请稍后重试。',DATA_MISSING:'该日期或阶段尚未发布。',SOURCE_UNAVAILABLE:'暂时无法读取快照存储。',QUERY_TIMEOUT:'读取超时，请重试。',ACCOUNT_EXISTS:'该手机号已受邀。',ACCOUNT_LIMIT:'已达到账号数量上限。',PARAMETERS_INVALID:'请检查输入。密码须为 8 位英文字母和数字的组合。',ACCOUNT_MISSING:'账号不存在。',CONTROL_UNAVAILABLE:'会话或限流服务暂不可用。',AUDIT_UNAVAILABLE:'审计服务暂不可用。'};
let session=null, epoch=0, sequence=0, active=null, selectedStage=null, view='top', catalog=null;
let result=null, order=null, busy=false, accountBusy=false;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(part=>part.type!=='literal').map(part=>part.value).join('');
const pretty=day=>day.replace(/^(....)(..)(..)$/,'$1-$2-$3');
const number=(value,digits)=>value==null?'—':Number(value).toLocaleString('zh-CN',{maximumFractionDigits:digits,minimumFractionDigits:digits});
const option=(value,label)=>new Option(label,value);
function showDialog(dialog){
 if(typeof dialog.showModal==='function')dialog.showModal();
 else dialog.setAttribute('open','');
}
function closeDialog(dialog){
 if(typeof dialog.close==='function')dialog.close();
 else if(dialog.hasAttribute('open')){
  dialog.removeAttribute('open');
  dialog.dispatchEvent(new Event('close'));
 }
}
for(const dialog of document.querySelectorAll('dialog')){
 dialog.querySelector('form[method="dialog"]').onsubmit=event=>{
  event.preventDefault();closeDialog(dialog);
 };
}
function clearCredential(){
 $('credential').hidden=true;
 $('credentialText').textContent='';
 $('invitePassword').value='';
}
function resetData(){
 result=null;
 $('table').textContent='';$('history').textContent='';$('historyTitle').textContent='昨日 D-1 · 合格个股';
 for(const id of ['observed','total','exposure'])$(id).textContent='—';
 $('health').textContent='';$('notice').textContent='';$('pageInfo').textContent='';
 $('quality').hidden=true;$('qualityRows').textContent='';closeDialog($('qualityDialog'));
 $('previous').disabled=$('next').disabled=true;
}
function signOut(message=''){
 epoch++;sequence++;active?.abort();session=null;catalog=null;selectedStage=null;order=null;busy=false;
 viewCache.clear();resetData();clearCredential();closeDialog($('accountsDialog'));$('accounts').textContent='';
 $('accountStatus').textContent='';$('createForm').reset();$('search').value='';$('date').replaceChildren();$('server').replaceChildren();
 $('password').value='';$('manageButton').hidden=true;$('appShell').hidden=true;$('boot').hidden=true;
 $('loginState').textContent=message;$('authGate').hidden=false;
}
async function api(path,{body,signal,silent=false}={}){
 const current=epoch;
 const controller=new AbortController();
 const cancel=()=>controller.abort();
 if(signal?.aborted)cancel();
 else signal?.addEventListener('abort',cancel,{once:true});
 let timedOut=false,response,data;
 const timer=setTimeout(()=>{timedOut=true;cancel()},signal?18000:15000);
 try{
  response=await fetch(path,{method:body===undefined?'GET':'POST',credentials:'same-origin',cache:'no-store',
   headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),signal:controller.signal});
  if(response.status!==401)data=await response.json();
 }catch(error){
  if(timedOut)throw new DOMException('请求超时，请重试。','TimeoutError');
  if(error instanceof TypeError)throw new Error('连接网站失败，请检查网络后重试。');
  throw error;
 }finally{
  clearTimeout(timer);signal?.removeEventListener('abort',cancel);
 }
 if(current!==epoch)throw new DOMException('旧会话请求','AbortError');
 if(response.status===401){
  const message=path==='/api/auth/login'?'手机号或密码错误。':'登录已失效，请重新登录。可能已在另一台设备登录。';
  signOut(silent?'':message);
  throw new Error(message);
 }
 if(!response.ok)throw new Error(errors[data.error?.code]||'请求失败（'+(data.error?.code||response.status)+'）');
 return data;
}
function begin(){
 sequence++;active?.abort();active=new AbortController();
 return {id:sequence,session:epoch,signal:active.signal};
}
function current(task){return session&&task.id===sequence&&task.session===epoch}
function setStage(preferred){
 const available=catalog?.stages_by_date?.[$('date').value]??(catalog?[]:stageOrder);
 selectedStage=available.includes(preferred)?preferred:stageOrder.find(stage=>available.includes(stage))??null;
 for(const button of stages){
  button.disabled=!available.includes(button.dataset.stage);
  button.setAttribute('aria-pressed',String(button.dataset.stage===selectedStage));
 }
}
async function loadCatalog(server,keepDate=false){
 const task=begin(), oldDate=$('date').value, oldStage=selectedStage;
 resetData();$('notice').textContent='正在读取已发布交易日…';
 selectedStage=null;
 for(const button of stages){button.disabled=true;button.setAttribute('aria-pressed','false')}
 $('date').disabled=true;
 let data;
 try{
  data=await api('/api/auction/latest'+(server?'?'+new URLSearchParams({server_id:server}):''),{signal:task.signal});
 }catch(error){
  if(!current(task))return;
  catalog=null;
  $('server').hidden=true;
  $('server').replaceChildren(option(server||'local',server||'local'));
  $('date').replaceChildren(option(today(),pretty(today())));
  $('date').disabled=false;
  setStage('final');
  return query(0,true,'发布目录暂不可用，已尝试上海当天日期。');
 }
 if(!current(task))return;
 catalog=data;
 $('server').replaceChildren(...data.server_ids.map(id=>option(id,id)));
 $('server').value=data.server_id??data.default_server_id;
 $('server').hidden=data.server_ids.length<2;
 $('date').replaceChildren(...data.recent_dates.map(day=>option(day,pretty(day))));
 $('date').disabled=!data.recent_dates.length;
 if(keepDate&&data.recent_dates.includes(oldDate))$('date').value=oldDate;
 else if(data.latest_trade_date)$('date').value=data.latest_trade_date;
 setStage(keepDate?oldStage:data.latest_stage);
 if(!selectedStage){$('notice').textContent='暂无已发布的 09:15、09:20 或 09:25 快照。';return}
 return query(0,true);
}
function rowCell(row,key){
 const value=row[key];
 if(key.endsWith('_amount_yuan'))return value==null?'—':number(value/10000,0)+' 万';
 if(key==='matched_price')return number(value,2);
 if(key==='score')return number(value,3);
 if(key==='gap_pct'||key==='turnover_pct')return value==null?'—':number(value,2)+'%';
 if(key==='qualified')return row.qualified?'通过':'—';
 if(key==='name')return esc(value||'—')+(row.qualified?'<span class="mobileMeta">通过</span>':'')
  +'<details class="mobileMeta"><summary>行情</summary>'+columns.slice(8).map(([field,label])=>'<small>'+label+' '+rowCell(row,field)+'</small>').join('')+'</details>';
 return esc(value);
}
function tableHtml(rows,canSort=false){
 if(!rows.length)return '<p class="empty">当前范围没有记录</p>';
 const heading=columns.map(([key,label])=>{
  const direction=canSort&&order?.key===key?(order.desc?'descending':'ascending'):'none';
  return canSort&&sortable.has(key)?'<th scope="col" aria-sort="'+direction+'"><button data-sort="'+key+'">'+label+(direction==='none'?' ↕':direction==='descending'?' ↓':' ↑')+'</button></th>':'<th scope="col" class="'+(extraFields.has(key)?'extra':'')+'">'+label+'</th>';
 }).join('');
 const body=rows.map(row=>'<tr class="'+(row.qualified?'qualified':'')+'">'+columns.map(([key])=>{
  const value=row[key];
  const risk=(key==='score'&&value>=.6&&value<=.8)||(key==='turnover_pct'&&value>=2&&value<=3);
  const low=key==='score'&&row.qualified&&value!=null&&value<.5;
  return '<td class="'+(extraFields.has(key)?'extra ':'')+(risk?'risk':low?'low':'')+'">'+rowCell(row,key)+'</td>';
 }).join('')+'</tr>').join('');
 return '<table><thead><tr>'+heading+'</tr></thead><tbody>'+body+'</tbody></table>';
}
function render(){
 if(!result)return;
 const needle=$('search').value.trim().toLowerCase();
 const rows=result.rows.filter(row=>String(row.code).includes(needle)||String(row.name??'').toLowerCase().includes(needle));
 if(order)rows.sort((a,b)=>(order.desc?-1:1)*(a[order.key]-b[order.key])||a.rank-b.rank);
 $('table').innerHTML=tableHtml(rows,true);
 $('pageInfo').textContent=result.rows.length?(result.offset+1)+'–'+(result.offset+result.rows.length)+' / '+result.total+(needle?' · 筛中 '+rows.length+' 条':''):'0 / '+result.total;
 $('previous').disabled=busy||view==='top'||result.offset===0;
 $('next').disabled=busy||view==='top'||result.offset+result.rows.length>=result.total;
}
function showDataQuality(data){
 const q=data.data_quality,p=data.provenance;
 const notes=[];
 if(q?.excluded_row_count)notes.push(q.excluded_row_count+' 只数据不足，未参与排名与候选判断；前30只覆盖有效数据。');
 if(q?.unranked_observation_count)notes.push(q.unranked_observation_count+' 只未排名观察记录。');
 if(p?.excluded_row_count)notes.push('来源另有 '+p.excluded_row_count+' 条缺失记录。');
 $('quality').hidden=!notes.length;
 $('qualitySummary').textContent=notes.join(' ');
 $('qualityButton').hidden=!q?.excluded_row_count;
 $('qualityRows').replaceChildren(...(q?.excluded_rows??[]).map(row=>{
  const item=document.createElement('li');
  item.textContent=[row.code,data.display?.stock_names?.[row.code],row.fields.map(field=>qualityFields[field]||field).join('、')].filter(Boolean).join(' · ');
  return item;
 }));
}
function showResult(data,prefix){
 result=data;
 $('health').textContent=data.data_quality?.excluded_row_count?'部分可用':data.data_healthy?'健康':'数据异常';
 $('observed').textContent=data.observed_at?.slice(11,19)||'—';
 $('total').textContent=data.total.toLocaleString();
 $('exposure').textContent=data.display?.exposure_weight==null?'未发布':number(data.display.exposure_weight*100,0)+'%';
 $('notice').textContent=prefix||'';
 showDataQuality(data);
 const prior=data.previous_qualified;
 $('historyTitle').textContent='昨日 D-1 · 合格个股'+(prior?.trade_date?' · '+pretty(prior.trade_date):'');
 $('history').innerHTML=prior?.status==='published'
  ?'<div class="kpi">'+esc(labels[prior.stage]||prior.stage)+' · '+esc(prior.total)+' 只'+(prior.total>prior.rows.length?' · 展示前 '+esc(prior.rows.length)+' 条':'')+'</div>'+tableHtml(prior.rows)
  :'<p class="empty">上一交易日合格股快照尚未发布</p>';
 render();
}
async function query(offset=0,force=false,prefix=''){
 if(!session||!selectedStage||!$('date').value)return;
 const task=begin();
 const args={trade_date:$('date').value,server_id:$('server').value||'local',stage:selectedStage,limit:view==='top'?30:pageSize,offset,qualified_only:view==='qualified'};
 const key=JSON.stringify(args), cached=viewCache.get(key);
 resetData();busy=true;$('notice').textContent='正在读取快照…';
 try{
  let data;
  if(!force&&cached&&Date.now()-cached.time<300000){
   await api('/api/auth/me',{signal:task.signal});
   data=cached.data;
  }else{
   data=await api('/api/auction/view',{body:args,signal:task.signal});
  }
  if(!current(task))return;
  viewCache.set(key,{data,time:data===cached?.data?cached.time:Date.now()});
  if(viewCache.size>20)viewCache.delete(viewCache.keys().next().value);
  showResult(data,prefix);
 }catch(error){
  if(current(task))$('notice').textContent=(prefix?prefix+' ':'')+(error.name==='TimeoutError'?'读取超时，请刷新重试。':error.message);
 }finally{if(current(task)){busy=false;render()}}
}
async function checkLogin(silent=false){
 try{
  session=await api('/api/auth/me',{silent});
  $('identity').textContent=session.admin?'管理员':'受邀账号';
  $('manageButton').hidden=session.admin!==true;
  $('boot').hidden=true;$('authGate').hidden=true;$('appShell').hidden=false;
  await loadCatalog();
 }catch(error){if($('authGate').hidden)signOut(error.message)}
}
$('loginForm').onsubmit=async event=>{
 event.preventDefault();$('loginButton').disabled=true;
 const body={phone:$('phone').value.trim(),password:$('password').value};$('password').value='';
 try{await api('/api/auth/login',{body});await checkLogin()}
 catch(error){$('loginState').textContent=error.message}
 finally{$('loginButton').disabled=false}
};
$('logoutButton').onclick=async()=>{
 try{await api('/api/auth/logout',{body:{}});signOut('已退出登录。')}
 catch(error){if(session)$('notice').textContent=error.message}
};
$('refresh').onclick=()=>{viewCache.clear();return loadCatalog($('server').value,true)};
$('server').onchange=()=>loadCatalog($('server').value);
$('date').onchange=()=>{setStage(selectedStage);return query()};
for(const button of stages)button.onclick=()=>{setStage(button.dataset.stage);return query()};
for(const button of views)button.onclick=()=>{
 view=button.dataset.view;
 for(const item of views)item.setAttribute('aria-pressed',String(item===button));
 return query();
};
$('search').oninput=render;
$('table').onclick=event=>{
 const key=event.target.closest('[data-sort]')?.dataset.sort;
 if(sortable.has(key)){
  order={key,desc:order?.key===key?!order.desc:true};
  render();$('table').querySelector('[data-sort="'+key+'"]')?.focus();
 }
};
$('previous').onclick=()=>result&&query(Math.max(0,result.offset-pageSize));
$('next').onclick=()=>result&&query(result.offset+pageSize);
$('qualityButton').onclick=()=>showDialog($('qualityDialog'));
const actionNames={disable:'禁用',enable:'启用',reset:'重置密码',revoke:'踢出会话',promote:'设为管理员'};
async function listAccounts(){
 const data=await api('/api/auth/accounts');
 if(!$('accountsDialog').hasAttribute('open'))return;
 $('accounts').replaceChildren(...data.accounts.map(account=>{
  const item=document.createElement('div');item.className='account';
  const title=document.createElement('p');title.textContent=account.label+' · '+(account.active?'已启用':'已禁用')+' · '+(account.admin?'管理员':'受邀账号');
  const controls=document.createElement('div');controls.className='segments';
  const actions=[account.active?'disable':'enable','reset','revoke'];
  if(session.can_promote&&!account.admin)actions.push('promote');
  for(const action of actions){
   const button=document.createElement('button');button.textContent=actionNames[action];
   button.onclick=()=>{
    if(confirm('确认对 '+account.label+' 执行'+actionNames[action]+'？'))return manageAccount({action,account_id:account.account_id},account.label);
   };
   controls.append(button);
  }
  item.append(title,controls);return item;
 }));
}
async function manageAccount(body,label){
 if(accountBusy)return;
 accountBusy=true;clearCredential();$('accountStatus').textContent='处理中…';
 try{
  const data=await api('/api/auth/accounts',{body});
  if(!$('accountsDialog').hasAttribute('open'))return;
  if(data.password){
   $('credentialText').textContent='账号 '+(body.phone||label)+' · 密码 '+data.password;
   $('credential').hidden=false;
  }
  $('accountStatus').textContent='操作成功。';
  await listAccounts();
 }catch(error){if(session)$('accountStatus').textContent=error.message}
 finally{accountBusy=false}
}
$('manageButton').onclick=async()=>{
 showDialog($('accountsDialog'));$('accountStatus').textContent='正在读取账号…';
 try{await listAccounts();$('accountStatus').textContent=''}
 catch(error){if(session)$('accountStatus').textContent=error.message}
};
$('createForm').onsubmit=event=>{
 event.preventDefault();
 const body={action:'create',phone:$('invitePhone').value.trim(),admin:$('makeAdmin').checked};
 if($('invitePassword').value)body.password=$('invitePassword').value;
 return manageAccount(body,body.phone);
};
$('copy').onclick=async()=>{
 try{await navigator.clipboard.writeText($('credentialText').textContent);$('accountStatus').textContent='已复制。'}
 catch(error){$('accountStatus').textContent='无法自动复制，请选中文字复制。'}
};
$('accountsDialog').addEventListener('close',()=>{clearCredential();$('createForm').reset();$('accounts').textContent='';$('accountStatus').textContent=''});
window.addEventListener('pagehide',()=>{$('password').value='';clearCredential();viewCache.clear();active?.abort()});
checkLogin(true);
</script>
