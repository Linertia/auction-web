<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>竞价快照查询</title><style>body{max-width:1000px;margin:48px auto;padding:20px;background:#0c1424;color:#e5edf9;font:16px system-ui}h1{font-size:28px}form{display:flex;flex-wrap:wrap;gap:16px;background:#17243a;padding:24px;border-radius:16px}label{display:grid;gap:8px}input,select,button{padding:10px;border-radius:8px;border:1px solid #455979;background:#101a2e;color:inherit}button{background:#3268dd;align-self:end;cursor:pointer}pre{white-space:pre-wrap;background:#17243a;padding:24px;border-radius:16px}small{color:#a9b9d0}</style>
<h1>竞价快照 · 只读查询</h1><p>查询监视器已发布的原始结果。日期与数据健康状态随结果返回。</p>
<form id="query"><label>日期 YYYYMMDD<input id="date" pattern="[0-9]{8}" value="20260930" required></label><label>服务器 ID<input id="server" value="local" required></label><label>阶段<select id="stage"><option value="final">原始09:25冻结</option><option value="corrected">后续更正解释</option><option>0915</option><option>0920</option><option>0924</option></select></label><label>个人访问凭证<input id="token" type="password" autocomplete="off" required></label><button>查询前30条</button></form><p><small>凭证仅用于本次请求；不写入浏览器存储。查询没有采集或交易控制功能。</small></p><pre id="result" aria-live="polite">等待查询</pre>
<script>document.querySelector('#query').addEventListener('submit',async e=>{e.preventDefault();const output=document.querySelector('#result');output.textContent='正在查询…';try{const r=await fetch('/api/auction/rank',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+document.querySelector('#token').value},body:JSON.stringify({trade_date:document.querySelector('#date').value,server_id:document.querySelector('#server').value,stage:document.querySelector('#stage').value,limit:30})});output.textContent=JSON.stringify(await r.json(),null,2);}catch{output.textContent='请求失败，请检查网络和服务状态';}finally{document.querySelector('#token').value='';}});</script></html>
